{% extends "base.html" %}
{% block title %}tags · {% endblock %}
{% block content %}
<section class="listing">
  <h1 class="listing__title">tags</h1>
  <ul class="tags tags--cloud">
  {%- for tag, articles in tags|sort %}
    <li><a href="{{ SITEURL }}/{{ tag.url }}">{{ tag }} <span class="count">{{ articles|count }}</span></a></li>
  {%- endfor %}
  </ul>
</section>
{% endblock %}
