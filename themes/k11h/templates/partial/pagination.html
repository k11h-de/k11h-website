{%- if articles_page and articles_paginator.num_pages > 1 %}
<nav class="pagination" aria-label="pagination">
  {%- if articles_page.has_previous() %}
  <a rel="prev" href="{{ SITEURL }}/{{ articles_previous_page.url }}">← newer</a>
  {%- else %}<span></span>{%- endif %}
  <span class="pagination__pos">{{ articles_page.number }} / {{ articles_paginator.num_pages }}</span>
  {%- if articles_page.has_next() %}
  <a rel="next" href="{{ SITEURL }}/{{ articles_next_page.url }}">older →</a>
  {%- else %}<span></span>{%- endif %}
</nav>
{%- endif %}
